<script>
let syntheticContext;
const originalMediaDevices=navigator.mediaDevices;
Object.defineProperty(originalMediaDevices,'getUserMedia',{value:async()=>{
 syntheticContext ||= new AudioContext();await syntheticContext.resume();
 const oscillator=syntheticContext.createOscillator(),gain=syntheticContext.createGain(),destination=syntheticContext.createMediaStreamDestination();
 oscillator.frequency.value=440;gain.gain.value=.12;oscillator.connect(gain).connect(destination);oscillator.start();
 const track=destination.stream.getAudioTracks()[0],stop=track.stop.bind(track);track.stop=()=>{stop();try{oscillator.stop()}catch{}};
 return destination.stream;
}});
</script>
